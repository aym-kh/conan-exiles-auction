@let currentUser = user$ | async;

<header id="mainHeader">
    @if (currentUser === undefined) {

    <p>Checking your session...</p>

    } @else if (currentUser) {

    <div class="flex flex-col items-center cursor-pointer" [routerLink]="'/guilds'">
        <img src="/images/title.webp" alt="title" class="w-32 pointer-events-none">
        <small>v{{ version }}</small>
    </div>

    <h3>Welcome, {{ currentUser.user_metadata?.['full_name'] }}!</h3>

    <app-button [text]="'Sign Out'" (click)="logout()"></app-button>

    } @else {

    <div id="loginInstructions">

        <div class="flex flex-col items-center cursor-pointer" [routerLink]="'/guilds'">
            <img src="/images/title.webp" alt="title" class="w-32 pointer-events-none">
            <small>v{{ version }}</small>
        </div>

        <app-button [text]="'login'" (click)="loginWithDiscord()"></app-button>
    </div>

    }
</header>
