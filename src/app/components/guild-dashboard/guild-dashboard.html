<div style="padding: 20px; font-family: sans-serif;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2>Server Auction Dashboard</h2>
            <p>Guild ID: <code>{{ guildId }}</code></p>
        </div>
        <div style="display: flex; gap: 8px;">
            <app-button [text]="'Create'" (click)="showCreateModal.set(true)"></app-button>
            <button (click)="loadAuctions()" style="padding: 8px 16px; cursor: pointer;">
                Refresh
            </button>
        </div>
    </div>

    <hr style="margin: 20px 0;" />

    @if (isLoading()) {
    <p>Loading auctions for this server...</p>
    } @else {
    @if (auctions().length === 0) {
    <div style="background: #f8f9fa; padding: 20px; text-align: center; border-radius: 6px;">
        <p>No active auctions for this server yet.</p>
    </div>
    } @else {
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
        @for (auction of auctions(); track auction.id) {
        <app-auction-plate [auction]="auction" [routerLink]="['/auctions', auction.id]"></app-auction-plate>
        }
    </div>
    }
    }

    <!-- Render Create Modal when active -->
    @if (showCreateModal()) {
    <app-auction-form [guildId]="guildId" (auctionCreated)="onAuctionCreated()"
        (closeModal)="showCreateModal.set(false)" />
    }
</div>
