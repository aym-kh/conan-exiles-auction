<div class="auction-form-backdrop">
    <section class="auction-form-plate" role="dialog" aria-modal="true"
        [attr.aria-label]="auction ? 'Edit auction' : 'Create auction'">
        <div class="plate-content">
            <header class="form-header">
                <h2>{{ auction ? 'Edit Auction' : 'Create New Auction' }}</h2>
            </header>

            @if (errorMessage()) {
            <p class="form-error" role="alert">{{ errorMessage() }}</p>
            }

            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <label class="form-field">
                    <span>Title *</span>
                    <input type="text" formControlName="title" placeholder="e.g., Sword of Crom" />
                </label>

                <label class="form-field">
                    <span>Description</span>
                    <textarea formControlName="description" rows="3"
                        placeholder="Flawless high-grade weapons, stats, etc."></textarea>
                </label>

                <label class="blind-auction">
                    <input type="checkbox" formControlName="is_blind" />
                    <span>Blind auction</span>
                </label>

                <div class="currency-fields" formArrayName="currencies">
                    <span class="field-heading">Currencies *</span>
                    @for (currency of currencyControls.controls; track $index) {
                    <div class="currency-row" [formGroupName]="$index">
                        <select formControlName="symbol" [attr.aria-label]="'Currency ' + ($index + 1)">
                            <option value="" disabled>Select currency</option>
                            @for (currencyOption of auctionCurrencyOptions; track currencyOption.symbol) {
                            <option [value]="currencyOption.symbol">{{ currencyOption.label }}</option>
                            }
                        </select>
                        <input type="number" formControlName="weight" min="1"
                            [attr.aria-label]="'Currency weight ' + ($index + 1)" />
                        <button class="plate-button remove-button" type="button" (click)="removeCurrency($index)"
                            [disabled]="currencyControls.length === 1">
                            Remove
                        </button>
                    </div>
                    }
                    <button class="plate-button secondary-button" type="button" (click)="addCurrency()">
                        Add currency
                    </button>
                </div>

                <label class="form-field">
                    <span>Auction Ends At *</span>
                    <input type="datetime-local" formControlName="end_time" />
                </label>

                <footer class="form-actions">
                    <button class="plate-button secondary-button" type="button" (click)="cancel()"
                        [disabled]="isSubmitting()">
                        Cancel
                    </button>
                    <button class="plate-button primary-button" type="submit" [disabled]="isSubmitting()">
                        {{ isSubmitting() ? 'Saving...' : auction ? 'Save Changes' : 'Create Auction' }}
                    </button>
                </footer>
            </form>
        </div>
    </section>
</div>
